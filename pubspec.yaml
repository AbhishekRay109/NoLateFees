name: nolatefees
description: "NoLateFees: expiry, renewal and due-date reminders, stored only on your phone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  intl: ^0.20.3
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  table_calendar: ^3.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.png

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo.png
  adaptive_icon_background: assets/logo/logo_background.png
  adaptive_icon_foreground: assets/logo/logo_foreground.png
  remove_alpha_ios: true
