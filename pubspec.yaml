name: duemate
description: "DueMate: expiry, renewal and due-date reminders that work offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  intl: ^0.20.3
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.0
  table_calendar: ^3.3.0
  timezone: ^0.11.1
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
