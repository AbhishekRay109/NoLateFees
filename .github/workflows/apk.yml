name: Build APK
# Builds an installable test APK. Run it from the Actions tab ("Run workflow").
# The APK is attached to a pre-release on the repo's Releases page, so it can be
# downloaded straight to a phone; it is also kept as the run's "duemate-apk" artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # to publish the APK as a release download

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      # Optional cloud sync: add repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: duemate-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DueMate test build ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
          body: Test build from ${{ github.sha }}. Download app-release.apk on your Android phone and open it to install.
