name: Build APK
# Builds an installable test APK. Run it from the Actions tab ("Run workflow").
# The APK is attached to a pre-release on the repo's Releases page, so it can be
# downloaded straight to a phone; it is also kept as the run's "nolatefees-apk" artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # to publish the APK as a release download

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      # Sign-in and cloud sync are optional. Add a repository secret named
      # APP_ENV_JSON holding the Firebase values (see docs/FIREBASE_SETUP.md).
      # Without it the APK runs fully offline.
      - name: Write env.json
        env:
          APP_ENV_JSON: ${{ secrets.APP_ENV_JSON }}
        run: |
          if [ -n "$APP_ENV_JSON" ]; then printf '%s' "$APP_ENV_JSON" > env.json; else echo '{}' > env.json; fi
          python3 -c "import json; d=json.load(open('env.json')); print('Cloud config keys:', sorted(d) or 'none (offline build)')"
      - name: Build release APK
        run: |
          export ADMOB_APP_ID=$(python3 -c "import json; print(json.load(open('env.json')).get('ADMOB_APP_ID', ''))")
          flutter build apk --release --dart-define-from-file=env.json
          cp build/app/outputs/flutter-apk/app-release.apk NoLateFees.apk
      - name: Show signing fingerprints (add these to Firebase)
        run: keytool -list -v -keystore android/app/ci-test.jks -storepass nolatefees-test | grep -E 'SHA1|SHA256'
      - uses: actions/upload-artifact@v4
        with:
          name: nolatefees-apk
          path: NoLateFees.apk
      - name: Publish APK as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: NoLateFees test build ${{ github.run_number }}
          prerelease: true
          files: NoLateFees.apk
          body: Test build from ${{ github.ref_name }} (${{ github.sha }}). Download NoLateFees.apk on your Android phone and open it to install.
