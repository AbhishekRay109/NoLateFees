name: Build APK
# Builds an installable test APK. Run it from the Actions tab ("Run workflow").
# The APK is attached to a pre-release on the repo's Releases page, so it can be
# downloaded straight to a phone; it is also kept as the run's "nolatefees-apk" artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # to publish the APK as a release download

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk NoLateFees.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nolatefees-apk
          path: NoLateFees.apk
      - name: Publish APK as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: NoLateFees test build ${{ github.run_number }}
          prerelease: true
          files: NoLateFees.apk
          body: Test build from ${{ github.ref_name }} (${{ github.sha }}). Download NoLateFees.apk on your Android phone and open it to install.
